<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dist/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <title>Password Recovery Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 0%, #6b7280 0%, #374151 60%, #1f2937 100%);
        }

        form {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 820px;
            padding: 48px 36px;
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .details {
            line-height: 1.4;
        }

        .forgotten-image {
            width: 50%;
            text-align: center;
        }

        .forgotten-image img {
            height: 40px;
        }

        .forgotten-content {
            width: 100%;
            padding: 10px 32px;
        }

        #email-message {
            display: none;
            color: #dc2626;
            font-size: 14px;
            margin-top: 6px;
        }

        #success-state {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin {
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 770px) {
            body {
                background: white;
                min-height: 20vh;
            }

            form {
                display: block;
                max-width: 600px;
                padding: 40px 28px;
                border: 1.5px solid #cbd5e1;
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
                border-radius: 20px;
            }

            .iconsvp {
                display: none;
            }

            .forgotten-image {
                width: 100%;
                margin-bottom: 20px;
            }

            .forgotten-image img {
                margin: auto;
            }

            .forgotten-content {
                padding: 0;
            }

            .login-icon {
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <form id="recovery-form" action="" novalidate aria-labelledby="recovery-heading">
        <!-- Dynamic Response Box -->
        <div id="responseBox" class="hidden mt-4 p-4 rounded-xl text-sm fade-in" role="alert"></div>

        <!-- Image Container -->
        <div class="forgotten-image">
            <img src="./images/5e5fd7c602ca7cd432feb68e_bonsai-logo.svg" alt="Bonsai logo">
        </div>

        <!-- Details & Form Fields -->
        <div class="forgotten-content">

            <!-- Standard Input Form View -->
            <div id="form-state">
                <div class="details text-left mb-6">
                    <div class="mb-4">
                        <a href="login.html" aria-label="Go back to login page"
                            class="inline-flex items-center text-gray-700 hover:text-gray-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-green-400 rounded-md p-1">
                            <i data-lucide="arrow-left" class="iconsvp w-6 h-6 text-[#00b289]" aria-hidden="true"></i>
                        </a>
                    </div>

                    <div>
                        <h1 id="recovery-heading" class="login-icon text-[23px] font-bold text-gray-900 mb-2">Forgot Password</h1>
                        <p class="text-[15px] text-gray-500">
                            We'll send a verification code to your email address
                        </p>
                    </div>
                </div>

                <div class="details">
                    <div class="mb-4">
                        <label for="recovery-email" class="block text-[14px] font-medium text-gray-900 mb-2">Email Address</label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" aria-hidden="true"></i>
                            <input id="recovery-email" name="email" type="email" placeholder="you@example.com"
                                autocomplete="email" inputmode="email" autocapitalize="none" autocorrect="off"
                                spellcheck="false" aria-invalid="false" aria-describedby="email-message" required
                                class="w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-[14px] text-gray-900 placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-green-200 focus:border-green-300 focus:bg-white transition-all duration-200">
                        </div>
                        <span id="email-message" role="alert" aria-live="polite"></span>
                    </div>

                    <!-- Submit Button -->
                    <button id="submit-btn" type="submit"
                        class="bg-[#00b289] hover:bg-[#009b77] text-white font-semibold py-4 rounded-full w-full flex items-center justify-center gap-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-400 transition-colors">
                        <span id="btn-spinner" class="hidden">
                            <i data-lucide="loader-circle" class="w-5 h-5 animate-spin" aria-hidden="true"></i>
                        </span>
                        <span id="btn-text">Send Verification Code</span>
                    </button>
                </div>
            </div>

            <!-- Success Confirmation View -->
            <div id="success-state" class="text-center py-4">
                <div class="w-12 h-12 bg-green-100 text-[#00b289] rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="check-circle-2" class="w-6 h-6" aria-hidden="true"></i>
                </div>
                <h2 class="text-[22px] font-bold text-gray-900 mb-2">Check your inbox</h2>
                <p class="text-[14px] text-gray-500 mb-6">
                    We sent a verification code to <strong id="sent-email-display" class="text-gray-900"></strong>.
                </p>
                <a href="polished-login.html"
                    class="inline-block w-full max-w-xs bg-[#00b289] hover:bg-[#009b77] text-white font-semibold py-3.5 px-6 rounded-full text-center text-[14px] shadow-sm hover:shadow-md transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-400">
                    Return to Login
                </a>
            </div>

        </div>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const recoveryForm = document.getElementById('recovery-form');
            const emailInput = document.getElementById('recovery-email');
            const emailMSG = document.getElementById('email-message');
            const submitBtn = document.getElementById('submit-btn');
            const btnSpinner = document.getElementById('btn-spinner');
            const btnText = document.getElementById('btn-text');
            const formState = document.getElementById('form-state');
            const successState = document.getElementById('success-state');
            const sentEmailDisplay = document.getElementById('sent-email-display');

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            const validateEmail = () => {
                const val = emailInput.value.trim();
                if (!val) {
                    emailInput.setAttribute('aria-invalid', 'true');
                    emailMSG.textContent = 'Please enter your email address.';
                    emailMSG.style.display = 'block';
                    return false;
                }
                if (!emailRegex.test(val)) {
                    emailInput.setAttribute('aria-invalid', 'true');
                    emailMSG.textContent = 'Please enter a valid email address.';
                    emailMSG.style.display = 'block';
                    return false;
                }
                emailInput.setAttribute('aria-invalid', 'false');
                emailMSG.style.display = 'none';
                return true;
            };

            emailInput.addEventListener('input', validateEmail);

            recoveryForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!validateEmail()) return;

                const userEmail = emailInput.value.trim().toLowerCase();

                // Set Loading State
                submitBtn.disabled = true;
                btnSpinner.classList.remove('hidden');
                btnText.textContent = 'Sending...';

                try {
                    // Replace this URL with your exact MockAPI resource endpoint
                    const apiUrl = 'https://6ab1cb629751d2b03e6d6bda.mockapi.io/signup/bonasi/Users';

                    const response = await fetch(apiUrl, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                    });

                    if (!response.ok) {
                        throw new Error(`Server returned status: ${response.status}`);
                    }

                    const users = await response.json();

                    // Case-insensitive lookup against the returned users list
                    const userFound = Array.isArray(users) && users.some(u => 
                        u.email && u.email.trim().toLowerCase() === userEmail
                    );

                    if (!userFound) {
                        emailInput.setAttribute('aria-invalid', 'true');
                        emailMSG.innerHTML = 'This email address is not registered. Please <a href="signup.html" class="underline text-[#00b289]">sign up</a>.';
                        emailMSG.style.display = 'block';
                        return;
                    }

                    // Email exists! Show Success State
                    sentEmailDisplay.textContent = userEmail;

                    const forgottenImg = document.querySelector('.forgotten-image');
                    if (forgottenImg) forgottenImg.style.display = 'none';

                    formState.style.display = 'none';
                    successState.style.display = 'block';

                } catch (err) {
                    console.error("MockAPI Error:", err);
                    emailInput.setAttribute('aria-invalid', 'true');
                    emailMSG.textContent = 'Something went wrong connecting to the database. Please try again.';
                    emailMSG.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    btnSpinner.classList.add('hidden');
                    btnText.textContent = 'Send Verification Code';
                }
            });

            lucide.createIcons();
        });
    </script>
</body>

</html>
